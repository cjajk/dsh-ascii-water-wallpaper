<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="ASCII water ripple wallpaper preview">
  <rect width="640" height="300" fill="#04060a"/>

  <!-- depth-band background tint -->
  <rect y="0" width="640" height="102" fill="#070b10" opacity="0.35"/>
  <rect y="204" width="640" height="96" fill="#0a1016" opacity="0.4"/>

  <!-- ascii-like texture rows: dashes / dots (no <text>) -->
  <g stroke="#9fc4da" opacity="0.28" stroke-linecap="round">
    <line x1="0" y1="30" x2="640" y2="34" stroke-width="2" stroke-dasharray="2 8 3 10 2 6"/>
    <line x1="0" y1="48" x2="640" y2="45" stroke-width="1.4" stroke-dasharray="1.5 7 2 9 3 6"/>
    <line x1="0" y1="66" x2="640" y2="68" stroke-width="2.2" stroke-dasharray="3 10 2 8 2 12"/>
    <line x1="0" y1="128" x2="640" y2="126" stroke-width="2" stroke-dasharray="2 9 3 11 2 7"/>
    <line x1="0" y1="146" x2="640" y2="149" stroke-width="1.6" stroke-dasharray="1.5 8 2 9 3 8"/>
    <line x1="0" y1="168" x2="640" y2="166" stroke-width="2.3" stroke-dasharray="3 11 2 9 3 10"/>
    <line x1="0" y1="234" x2="640" y2="232" stroke-width="2.4" stroke-dasharray="3 10 2 12 3 9"/>
    <line x1="0" y1="256" x2="640" y2="259" stroke-width="1.8" stroke-dasharray="2 9 3 10 2 8"/>
    <line x1="0" y1="280" x2="640" y2="278" stroke-width="2.6" stroke-dasharray="3 12 2 10 3 11"/>
  </g>

  <!-- brighter highlight flecks -->
  <g fill="#e9f4fb" opacity="0.55">
    <circle cx="70" cy="42" r="1.6"/>
    <circle cx="210" cy="60" r="1.3"/>
    <circle cx="380" cy="150" r="1.6"/>
    <circle cx="520" cy="126" r="1.4"/>
    <circle cx="150" cy="250" r="1.7"/>
    <circle cx="470" cy="270" r="1.5"/>
    <circle cx="600" cy="46" r="1.3"/>
    <circle cx="40" cy="180" r="1.4"/>
  </g>

  <!-- floating particles -->
  <g fill="#d7e7f2">
    <circle cx="120" cy="92" r="2" opacity="0.5"/>
    <circle cx="560" cy="86" r="1.8" opacity="0.4"/>
    <circle cx="300" cy="60" r="1.6" opacity="0.45"/>
    <circle cx="80" cy="210" r="1.8" opacity="0.42"/>
  </g>

  <!-- click impact ripple (center-ish) -->
  <g fill="none">
    <ellipse cx="340" cy="150" rx="46" ry="22" stroke="#8fb9d4" stroke-width="1.6" opacity="0.85"/>
    <ellipse cx="340" cy="150" rx="88" ry="42" stroke="#d7e9f4" stroke-width="1.3" opacity="0.6"/>
    <ellipse cx="340" cy="150" rx="134" ry="64" stroke="#5c93bb" stroke-width="1.2" opacity="0.42"/>
    <ellipse cx="340" cy="150" rx="186" ry="90" stroke="#9fc4da" stroke-width="1" opacity="0.26"/>
  </g>

  <!-- small trail ripple -->
  <g fill="none">
    <ellipse cx="560" cy="220" rx="26" ry="13" stroke="#bcd8e8" stroke-width="1.3" opacity="0.55"/>
    <ellipse cx="560" cy="220" rx="48" ry="24" stroke="#7fb0cf" stroke-width="1.1" opacity="0.35"/>
  </g>
</svg>
